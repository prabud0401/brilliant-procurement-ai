# Extends the default gitleaks rules. The allowlist covers test-only dummy literals
# (no real credentials), so a full-history scan stays clean.
[extend]
useDefault = true

[[allowlists]]
description = "Ignore local uncommitted env file"
paths = ['''\.env$''', '''^\.env$''']

[[allowlists]]
description = "Test-only dummy values in unit/integration tests"
regexTarget = "match"
regexes = [
  '''valid-secret-with-at-least-32-chars-long''',
  '''idem-key-\d+''',
]
paths = ['''services/backend/tests/.*''']

[[allowlists]]
description = "Public, documented Azurite storage emulator key (works only against the local emulator)"
regexTarget = "match"
regexes = ['''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''']
