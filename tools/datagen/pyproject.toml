[project]
name = "datagen"
version = "0.1.0"
description = "Synthetic document generator, seed data, and evaluation replay tools"
requires-python = ">=3.12"
dependencies = [
    "reportlab>=4.2.0",
    "pillow>=10.3.0",
    "pypdf>=4.2.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["../../services/backend/tests"]
pythonpath = ["../../services/backend", "../.."]
markers = [
    "unit: Unit tests (no external services required)",
    "integration: Integration tests (may require DB or multi-component integration)",
    "security: Security and injection tests",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
