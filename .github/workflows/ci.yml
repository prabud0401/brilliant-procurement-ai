name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: services/backend
        run: uv sync --frozen

      - name: Lint and format check
        working-directory: services/backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app

  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      JWT_SECRET: dev-secret-for-ci-testing-purposes-only-32c
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: services/backend
        run: uv sync --frozen

      - name: Run unit and security tests
        working-directory: services/backend
        run: uv run pytest -m "unit or security"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_PASSWORD: ci_postgres_password
      APP_DB_PASSWORD: ci_app_user_password
      DATABASE_URL_MIGRATOR: postgresql+psycopg://postgres:ci_postgres_password@localhost:5432/postgres
      DATABASE_URL: postgresql+psycopg://app_user:ci_app_user_password@localhost:5432/postgres
      APP_ENV: test
      JWT_SECRET: dev-secret-for-ci-testing-purposes-only-32c
      JWT_ISSUER: brilliant-procurement-ai
      DEMO_USER_PASSWORD: demo_ci_password_123
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: services/backend
        run: uv sync --frozen

      - name: Run Alembic migrations cycle (up -> down -> up)
        working-directory: services/backend
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run integration tests
        working-directory: services/backend
        run: uv run pytest -m "integration"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks secret detection
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source /repo --no-git -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t pda-backend:ci -f services/backend/Dockerfile .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint and typecheck
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck

      - name: Run unit tests
        working-directory: apps/web
        run: npm run test

      - name: Build Next.js standalone application
        working-directory: apps/web
        env:
          API_BASE_URL: http://localhost:8000
        run: npm run build

      - name: Build web Docker image
        run: docker build -t pda-web:ci apps/web

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on scripts
        run: shellcheck scripts/*.sh

      - name: Lint and build Bicep templates
        run: |
          for file in infra/*.bicep infra/modules/*.bicep; do
            if [ -f "$file" ]; then
              echo "Linting $file..."
              az bicep lint --file "$file"
              echo "Building $file..."
              az bicep build --file "$file" --stdout > /dev/null
            fi
          done
